<style>
[hidden] { display: none !important; }
/* Layout: una colonna stretta da telefono, lista di esercizi stile foglio di carta, navigazione fissa in basso. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #151a22;
  --muted: #5d6676;
  --line: #dde2ea;
  --biro: #1d3fb8;
  --red: #c0392b;
  --orange: #c4631f;
  --green: #2a7d52;
  --blue: #2b6cb0;
  --done: #e7f3ec;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  --f-pen: "Barlow Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #181e26; --ink: #eaeef4; --muted: #9aa5b5; --line: #29313c;
    --biro: #8ea6ff; --red: #ff7b6b; --orange: #f09a5a; --green: #5cc38f; --blue: #6fb0f2; --done: #15281f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e26; --ink: #eaeef4; --muted: #9aa5b5; --line: #29313c;
  --biro: #8ea6ff; --red: #ff7b6b; --orange: #f09a5a; --green: #5cc38f; --blue: #6fb0f2; --done: #15281f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  padding-block: 12px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1; text-transform: uppercase; }
h2 { font-size: 24px; text-transform: uppercase; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.weekpen { font-family: var(--f-pen); font-size: 40px; line-height: .9; color: var(--biro); white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.sess { display: grid; grid-template-columns: 8px 1fr auto; gap: 14px; align-items: center; padding: 14px 14px 14px 0; width: 100%; text-align: left; cursor: pointer; }
.sess .bar { align-self: stretch; border-radius: 10px 0 0 10px; background: var(--c); }
.sess h3 { font-size: 26px; }
.sess .meta { font-size: 14px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--ink); color: var(--bg); white-space: nowrap; }
.go { font-family: var(--f-display); font-size: 28px; color: var(--muted); }

.ex { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--c); }
.ex.alldone { background: var(--done); }
.exhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.exname { font-weight: 600; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.scheme { font-size: 14px; color: var(--muted); }
.kgbox { display: flex; align-items: baseline; gap: 4px; flex: none; }
.kg { width: 96px; border: 0; border-bottom: 2px solid var(--line); background: transparent; color: var(--biro); font-family: var(--f-pen); font-weight: 700; font-size: 28px; line-height: 1.1; text-align: right; font-variant-numeric: tabular-nums; padding: 0 2px; border-radius: 0; }
.kg:focus { outline: none; border-bottom-color: var(--biro); }
.unit { font-size: 13px; color: var(--muted); }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { min-width: 48px; height: 48px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 22px; cursor: pointer; }
.set[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.items { margin: 0; padding-left: 20px; font-size: 15px; }
.note { padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; font-size: 15px; }
.note .sub { margin-top: 8px; font-weight: 600; }
.note .nl { margin: 4px 0 0; padding-left: 20px; }
.note b { font-family: var(--f-display); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }

.btn { border: 0; border-radius: 8px; padding: 13px 16px; font-weight: 600; cursor: pointer; background: var(--ink); color: var(--bg); min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.back { background: none; border: 0; padding: 8px 0; color: var(--muted); font-weight: 600; cursor: pointer; min-height: 40px; text-align: left; }

.phase { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.phase.active { border-color: var(--biro); box-shadow: 0 0 0 1px var(--biro); }
.phasehead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.dot.on { background: var(--biro); border-color: var(--biro); }
.dot.extra { border-style: dashed; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .n { font-family: var(--f-pen); font-weight: 700; font-size: 34px; color: var(--biro); min-width: 40px; text-align: center; line-height: 1; }
.sq { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-size: 22px; cursor: pointer; }

.hist { padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.hist b { font-weight: 600; }
select { font: inherit; padding: 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; min-height: 46px; }
.prog { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 14px; }
.prog .v { font-family: var(--f-pen); font-weight: 700; font-size: 24px; color: var(--biro); line-height: 1.1; text-align: right; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); z-index: 5; }
.nav .in { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 640px; gap: 6px; }
.nav button { background: none; border: 0; border-radius: 8px; min-height: 48px; font-family: var(--f-display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); cursor: pointer; }
.nav button[aria-current="page"] { color: var(--biro); background: var(--bg); }
.timer { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.timer .in { max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 8px; }
.timer .t { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; flex: 1; }
.timer .t small { font-family: var(--f-body); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; font-weight: 600; opacity: .75; }
.timer button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; min-height: 44px; padding: 0 12px; font-weight: 600; cursor: pointer; }
.timer.end [data-a="t+15"], .timer.end [data-a="t-15"] { display: none; }
.timer.end .in { background: var(--green); color: #fff; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 8; max-width: calc(100% - 32px); }
.status { font-size: 13px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--biro); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .set { transition: background .12s, border-color .12s; } }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld span { font-size: 14px; color: var(--muted); font-weight: 600; }
.txt { font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; min-height: 46px; }
textarea.txt { resize: vertical; }
.txt:focus { outline: none; border-color: var(--biro); }
.erow { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.etxt { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.ebtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sq:disabled { opacity: .35; cursor: default; }
.btn.danger { color: var(--red); border-color: var(--red); }
.chk { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
.filebtn input { display: none; }
.nag { border-style: solid; border-color: var(--orange); }
.exitwrap { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.exitcard { padding: 18px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
.exitcard b { font-family: var(--f-display); font-size: 26px; text-transform: uppercase; }
</style>

</head>

    else if (a === 'add-sess') {
      var pp = getPhase(editCtx.p); pp.sessions.push({ id: 's' + Date.now().toString(36), label: 'Nuovo allenamento', tag: '', ex: [] }); queueSave();
      editCtx.s = pp.sessions.length - 1; view = 'edsess'; render(); window.scrollTo(0, 0);
    }
    else if (a === 'add-ex') {
      var xs = getPhase(editCtx.p).sessions[editCtx.s], t = b.dataset.t;
      xs.ex.push(t === 'note' ? { note: true, title: 'Finale', text: '' } : t === 'circ' ? { circuit: true, label: 'Nuovo circuito', s: 3, rest: 60, items: [] } : { n: 'Nuovo esercizio', s: 3, r: '10', rest: 90, kg: '' });
      buildIndex(); queueSave(); editCtx.e = xs.ex.length - 1; view = 'edex'; render(); window.scrollTo(0, 0);
    }
    else if (a === 'mv') {
      var arr2 = b.dataset.k === 'phase' ? PHASES : b.dataset.k === 'sess' ? getPhase(editCtx.p).sessions : getPhase(editCtx.p).sessions[editCtx.s].ex;
      var i2 = +b.dataset.i, j2 = i2 + +b.dataset.d;
      if (j2 >= 0 && j2 < arr2.length) { var tmp = arr2[i2]; arr2[i2] = arr2[j2]; arr2[j2] = tmp; buildIndex(); queueSave(); render(); }
    }
    else if (a === 'del') {
      var tok = b.dataset.k + ':' + b.dataset.i;
      if (armed !== tok) { armed = tok; render(); clearTimeout(armT); armT = setTimeout(function () { armed = ''; render(); }, 3500); }
      else { armed = ''; clearTimeout(armT); doDelete(b.dataset.k, +b.dataset.i); }
    }
    else if (a === 'export') exportData();
    else if (a === 'imp-no') { pendingImport = null; render(); }
    else if (a === 'imp-yes') applyImport();
    else if (a === 'nav') { askReset = false; stopTimer(); view = b.dataset.v; progKey = progKey; render(); window.scrollTo(0, 0); }
    else if (a === 'open') {
      cur = +b.dataset.i; var ph = phaseObj(), sid = ph.id + ph.sessions[cur].id;
      if (!draft || draft.sid !== sid || draft.date !== today()) draft = { date: today(), sid: sid, sets: {} };
      view = 'workout'; render(); window.scrollTo(0, 0);
    }
    else if (a === 'back') { stopTimer(); view = 'home'; render(); }
    else if (a === 'set') {
      var i = +b.dataset.i, j = +b.dataset.j, e = currentSession().ex[i];
      var arr = draft.sets[i] || (draft.sets[i] = []);
      arr[j] = arr[j] ? 0 : 1;
      b.setAttribute('aria-pressed', arr[j] ? 'true' : 'false');
      var full = true; for (var k = 0; k < e.s; k++) if (!arr[k]) full = false;
      document.getElementById('ex' + i).classList.toggle('alldone', full);
      saveDraft(); updateCount();
      if (arr[j]) startTimer(e.rest); else stopTimer();
    }
    else if (a === 'finish') {
      var s = currentSession(), done = updateCount();
      if (!done) { toast('Spunta almeno una serie'); return; }
      var loads = {}, total = 0;
      s.ex.forEach(function (e) { if (e.note) return; total += e.s; if (e.key && !e.bw) { var v = getLoad(e.key); if (v) loads[e.key] = v; } });
      var ph = phaseObj();
      state.history.push({ d: today(), ph: ph.id, t: Date.now(), wk: wkOf(ph), pn: ph.name, s: s.id, sl: s.label, l: loads, n: done, t: total });
      if (state.history.length > 400) state.history = state.history.slice(-400);
      touch(); draft = null; lsSet(DK(), ''); stopTimer(); flush();
      view = 'home'; render(); window.scrollTo(0, 0); toast('Allenamento salvato');
    }
    else if (a === 'wk+' || a === 'wk-') { p = +b.dataset.p; state.weeks[p] = Math.max(1, (state.weeks[p] || 1) + (a === 'wk+' ? 1 : -1)); queueSave(); render(); }
    else if (a === 'activate') { state.phase = +b.dataset.p; queueSave(); render(); toast('Fase ' + state.phase + ' attiva'); }
    else if (a === 'reset-ask') { askReset = true; render(); window.scrollTo(0, document.body.scrollHeight); }
    else if (a === 'reset-no') { askReset = false; render(); }
    else if (a === 'reset-yes') { state.history = []; state.resetAt = Date.now(); touch(); progKey = ''; askReset = false; flush(); render(); window.scrollTo(0, 0); toast('Storico azzerato'); }
    else if (a === 't+15') { timer.end += 15000; var el = document.getElementById('timer'); el.classList.remove('end'); timer.fired = false; tick(); }
    else if (a === 't-15') { timer.end -= 15000; tick(); }
    else if (a === 't-skip') stopTimer();
  }
  function onInput(ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('kg')) { state.loads[t.dataset.key] = t.value.trim(); queueSave(); }
    else if (t.dataset && t.dataset.f && t.type !== 'checkbox') editField(t);
  }
  function onChange(ev) {
    var t = ev.target;
    if (t.id === 'progsel') { progKey = t.value; render(); }
    else if (t.type === 'checkbox' && t.dataset.f) { editField(t); render(); }
    else if (t.id === 'impfile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result), pr = {};
          if (d && d.app === 'scheda-palestra') {
            if (d.profiles) pr = d.profiles; else if (d.state && d.profile) pr[d.profile] = { state: d.state };
          }
          var ok = {}, any = false;
          PROFILES.forEach(function (p) { var e = pr[p.id]; if (e && e.state && Array.isArray(e.state.plan) && e.state.plan.length) { ok[p.id] = e; any = true; } });
          if (any) { pendingImport = { profiles: ok }; render(); } else toast('File non valido');
        } catch (e) { toast('File non valido'); }
      };
      fr.readAsText(t.files[0]); t.value = '';
    }
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  window.addEventListener('pagehide', function () { flush(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(true); else scheduleSync(); });
  window.addEventListener('online', scheduleSync);

  try { window.history.replaceState({ guard: true }, ''); window.history.pushState({ view: 'profiles', ctx: {}, cur: null }, ''); } catch (e) {}
  lastNav = 'profiles|{}|null';
  render();
  if (syncCfg()) setTimeout(syncNow, 400);
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
})();
</script>
